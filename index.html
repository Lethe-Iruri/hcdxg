<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>恶搞版合成大丑照</title>
    <!-- Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- html2canvas 用于保存海报 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Canvas Confetti 胜利礼花特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #09070F;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 920px;
            background: linear-gradient(180deg, #2b1a4a 0%, #170d2c 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (min-width: 481px) {
            #game-container {
                border-radius: 16px;
                height: 95vh;
            }
        }
        
        /* 顶部 UI 区域 */
        #header {
            position: absolute;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            width: 100%;
            height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            z-index: 10;
            pointer-events: none;
            color: #ffffff;
        }
        
        .score-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .score-label { font-size: 11px; color: #a29bfe; }
        .score-val { font-size: 22px; font-weight: bold; color: #fdcb6e; }

        .next-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .next-label { font-size: 12px; color: #dfe6e9; font-weight: 500; }
        .next-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #a29bfe;
            object-fit: cover;
            background: #000;
        }

        .timer { font-size: 18px; font-weight: bold; color: #fdcb6e; letter-spacing: 0.5px; }

        #footer-hint {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .modal-overlay {
            display: flex;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        #difficulty-card, #poster-card {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 320px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 900;
            color: #2d3436;
            margin-bottom: 6px;
        }
        .modal-desc {
            font-size: 13px;
            color: #636e72;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .diff-btn {
            width: 100%;
            padding: 14px 0;
            margin: 8px 0;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            color: white;
        }
        .diff-btn:active { transform: scale(0.95); }
        .btn-easy { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .btn-hard { background: linear-gradient(135deg, #e74c3c, #c0392b); }

        #poster-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid #ffcc00;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.95); }
        .btn-save { background: #2ecc71; color: white; }
        .btn-restart { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div class="score-box">
            <span class="score-label">分数</span>
            <span class="score-val" id="score-val">0</span>
        </div>
        
        <div class="next-box">
            <span class="next-label">下一个</span>
            <img id="next-img" class="next-preview" src="" alt="next">
        </div>

        <div class="timer" id="timer-val">01:40</div>
    </div>

    <canvas id="game-canvas"></canvas>
    <div id="footer-hint">👈 滑动屏幕瞄准，抬手落球 👉</div>

    <!-- 难度选择弹窗 -->
    <div id="difficulty-modal" class="modal-overlay">
        <div id="difficulty-card">
            <div class="modal-title">选择游戏难度</div>
            <div class="modal-desc">已为移动端缩小球体，操作更加丝滑！</div>
            <button class="diff-btn btn-easy" onclick="selectDifficulty('easy')">😊 简单模式 (空间大·易通关)</button>
            <button class="diff-btn btn-hard" onclick="selectDifficulty('hard')">🔥 困难模式 (球体稍大·考操作)</button>
        </div>
    </div>

    <!-- 结算界面 -->
    <div id="settlement-modal" class="modal-overlay" style="display: none;">
        <div id="poster-card">
            <img id="final-photo" src="" alt="结算照片">
            <div class="modal-title" id="modal-title" style="color: #d63031; margin-top: 10px;">丑出天际！通关胜利！</div>
            <div class="modal-desc" id="modal-sub" style="margin-bottom: 0;">你成功解锁了等级7终极丑照！</div>
        </div>
        <div class="btn-group">
            <button class="btn btn-save" id="btn-save" onclick="saveToAlbum()">保存到相册</button>
            <button class="btn btn-restart" onclick="restartGame()">再试一次</button>
        </div>
    </div>
</div>

<script>
    const PHOTO_URLS = [
        "微信图片_20260817092537_125_43.jpg", // L0
        "微信图片_20260817095417_130_43.jpg", // L1
        "微信图片_20260817095651_132_43.jpg", // L2
        "微信图片_20260817095323_129_43.jpg", // L3
        "mmexport1786936107905.jpg",          // L4
        "微信图片_20260817092535_124_43.jpg", // L5
        "微信图片_20260817095418_131_43.jpg"  // L6 终极丑照
    ];

    const FALLBACK_COLORS = ['#ff7675', '#74b9ff', '#55efc4', '#a29bfe', '#ffeaa7', '#fab1a0', '#fd79a8'];

    // 针对手机移动端进一步优化的半径尺寸（单位：px）
    const RADIUS_CONFIG = {
        easy: [30, 40, 52, 66, 82, 100, 120],  // 简单：极高的容错率
        hard: [38, 50, 65, 80, 98, 118, 140]   // 困难：适中具有挑战性
    };

    let RADIUS_TIERS = RADIUS_CONFIG.easy;
    const SCORE_TIERS = [10, 20, 40, 80, 160, 320, 640];

    const loadedImages = [];
    PHOTO_URLS.forEach((url) => {
        const img = new Image();
        img.src = url;
        loadedImages.push(img);
    });

    const { Engine, Bodies, Composite, Events } = Matter;

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let width, height, dpr;

    function resizeCanvas() {
        width = container.clientWidth;
        height = container.clientHeight;
        dpr = window.devicePixelRatio || 1;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const engine = Engine.create({
        gravity: { x: 0, y: 1.6, scale: 0.001 }
    });

    const wallOptions = { isStatic: true, restitution: 0.2, friction: 0.1 };
    const ground = Bodies.rectangle(width / 2, height + 30, width * 2, 60, wallOptions);
    const leftWall = Bodies.rectangle(-30, height / 2, 60, height * 2, wallOptions);
    const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height * 2, wallOptions);
    Composite.add(engine.world, [ground, leftWall, rightWall]);

    let score = 0;
    let currentBall = null;
    let pointerX = width / 2;
    let isTouching = false;

    function getRandomDropLevel() {
        const rand = Math.random();
        if (rand < 0.55) return 0;      
        if (rand < 0.90) return 1;     
        return 2;                      
    }

    let nextBallLevel = getRandomDropLevel();
    let canDrop = false;
    let gameEnded = false;

    let timeLeft = 100; 
    let timerInterval = null;

    function selectDifficulty(mode) {
        RADIUS_TIERS = RADIUS_CONFIG[mode];
        document.getElementById('difficulty-modal').style.display = 'none';
        
        score = 0;
        timeLeft = 100;
        gameEnded = false;
        document.getElementById('score-val').innerText = '0';
        
        startTimer();
        createPreviewBall();
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gameEnded) return;
            timeLeft--;
            let m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            let s = String(timeLeft % 60).padStart(2, '0');
            document.getElementById('timer-val').innerText = `${m}:${s}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                triggerGameOver("时间耗尽，未能限时合成大丑照！");
            }
        }, 1000);
    }

    function createPreviewBall() {
        if (gameEnded) return;
        
        const level = nextBallLevel;
        const displayRadius = Math.min(30, RADIUS_TIERS[level]);
        
        currentBall = {
            x: pointerX,
            y: 115,
            radius: displayRadius,
            actualRadius: RADIUS_TIERS[level],
            level: level
        };

        nextBallLevel = getRandomDropLevel();
        document.getElementById('next-img').src = PHOTO_URLS[nextBallLevel];

        canDrop = true;
    }

    function updatePointerPosition(clientX) {
        const rect = container.getBoundingClientRect();
        let targetX = clientX - rect.left;
        
        const radiusLimit = currentBall ? currentBall.actualRadius : 25;
        pointerX = Math.max(radiusLimit, Math.min(width - radiusLimit, targetX));
        
        if (currentBall) {
            currentBall.x = pointerX;
        }
    }

    function dropBall() {
        if (!canDrop || !currentBall || gameEnded) return;
        canDrop = false;

        const body = Bodies.circle(currentBall.x, currentBall.y, currentBall.actualRadius, {
            restitution: 0.28,
            friction: 0.25,
            density: 0.002,
            label: 'ball',
            customLevel: currentBall.level
        });

        Composite.add(engine.world, body);
        currentBall = null;

        setTimeout(() => {
            createPreviewBall();
        }, 350);
    }

    // 移动端触控优化
    container.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
            isTouching = true;
            updatePointerPosition(e.touches[0].clientX);
        }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
        if (isTouching && e.touches.length > 0) {
            updatePointerPosition(e.touches[0].clientX);
        }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
        if (isTouching) {
            isTouching = false;
            dropBall();
        }
    });

    window.addEventListener('mousemove', (e) => updatePointerPosition(e.clientX));
    container.addEventListener('click', (e) => {
        if (!('ontouchstart' in window)) {
            updatePointerPosition(e.clientX);
            dropBall();
        }
    });

    Events.on(engine, 'collisionStart', (event) => {
        const pairs = event.pairs;
        for (let i = 0; i < pairs.length; i++) {
            const { bodyA, bodyB } = pairs[i];

            if (bodyA.label === 'ball' && bodyB.label === 'ball') {
                if (bodyA.customLevel === bodyB.customLevel && !bodyA.isMerging && !bodyB.isMerging) {
                    const currentLvl = bodyA.customLevel;
                    
                    bodyA.isMerging = true;
                    bodyB.isMerging = true;

                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;

                    Composite.remove(engine.world, bodyA);
                    Composite.remove(engine.world, bodyB);

                    score += SCORE_TIERS[currentLvl];
                    document.getElementById('score-val').innerText = score;

                    const nextLvl = currentLvl + 1;

                    if (nextLvl >= 6) { 
                        spawnNewBall(midX, midY, 6);
                        setTimeout(() => triggerVictory(), 300);
                    } else {
                        spawnNewBall(midX, midY, nextLvl);
                    }
                }
            }
        }
    });

    function spawnNewBall(x, y, level) {
        const radius = RADIUS_TIERS[level];
        const newBody = Bodies.circle(x, y, radius, {
            restitution: 0.28,
            friction: 0.2,
            density: 0.002,
            label: 'ball',
            customLevel: level
        });
        Composite.add(engine.world, newBody);
    }

    function drawBallContent(ctx, img, radius, level) {
        if (img && img.complete && img.naturalWidth > 0) {
            const imgRatio = img.naturalWidth / img.naturalHeight;
            let sWidth = img.naturalWidth;
            let sHeight = img.naturalHeight;
            let sx = 0, sy = 0;

            if (imgRatio > 1) {
                sWidth = sHeight;
                sx = (img.naturalWidth - sWidth) / 2;
            } else {
                sHeight = sWidth;
                sy = (img.naturalHeight - sHeight) / 2;
            }

            ctx.drawImage(img, sx, sy, sWidth, sHeight, -radius, -radius, radius * 2, radius * 2);
        } else {
            ctx.fillStyle = FALLBACK_COLORS[level % FALLBACK_COLORS.length];
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("LV." + level, 0, 0);
        }
    }

    (function renderLoop() {
        Engine.update(engine, 1000 / 60);
        ctx.clearRect(0, 0, width, height);

        const warningY = 160;
        ctx.beginPath();
        ctx.moveTo(0, warningY);
        ctx.lineTo(width, warningY);
        ctx.strokeStyle = "rgba(255, 118, 117, 0.6)";
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        const bodies = Composite.allBodies(engine.world);
        bodies.forEach(body => {
            if (body.label === 'ball' && body.position.y < warningY && Math.abs(body.velocity.y) < 0.2 && !canDrop) {
                triggerGameOver("超过警戒线，堆叠失败！");
            }
        });

        // 绘制悬浮预备球
        if (currentBall) {
            ctx.beginPath();
            ctx.moveTo(currentBall.x, currentBall.y);
            ctx.lineTo(currentBall.x, height);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.save();
            ctx.translate(currentBall.x, currentBall.y);
            
            ctx.beginPath();
            ctx.arc(0, 0, currentBall.radius, 0, Math.PI * 2);
            ctx.clip();

            drawBallContent(ctx, loadedImages[currentBall.level], currentBall.radius, currentBall.level);

            ctx.beginPath();
            ctx.arc(0, 0, currentBall.radius - 1, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.restore();
        }

        // 绘制场上球
        bodies.forEach(body => {
            if (body.label === 'ball') {
                const { x, y } = body.position;
                const radius = RADIUS_TIERS[body.customLevel];

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(body.angle);

                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.clip();

                drawBallContent(ctx, loadedImages[body.customLevel], radius, body.customLevel);

                ctx.beginPath();
                ctx.arc(0, 0, radius - 1, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.restore();
            }
        });

        requestAnimationFrame(renderLoop);
    })();

    function triggerVictory() {
        gameEnded = true;
        clearInterval(timerInterval);
        document.getElementById('final-photo').src = PHOTO_URLS[6];
        document.getElementById('modal-title').innerText = "丑出天际！通关胜利！";
        document.getElementById('modal-sub').innerText = "你成功解锁了等级7终极丑照！";
        document.getElementById('btn-save').style.display = "block";
        document.getElementById('settlement-modal').style.display = 'flex';

        if (typeof confetti === 'function') {
            confetti({ particleCount: 100, spread: 60, origin: { y: 0.6 } });
        }
    }

    function triggerGameOver(reason) {
        if(gameEnded) return;
        gameEnded = true;
        clearInterval(timerInterval);
        document.getElementById('final-photo').src = PHOTO_URLS[0];
        document.getElementById('modal-title').innerText = "挑战失败！";
        document.getElementById('modal-sub').innerText = reason;
        document.getElementById('btn-save').style.display = "none";
        document.getElementById('settlement-modal').style.display = 'flex';
    }

    function saveToAlbum() {
        const card = document.getElementById('poster-card');
        html2canvas(card).then(canvas => {
            const link = document.createElement('a');
            link.download = '终极丑照海报.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function restartGame() {
        const bodies = Composite.allBodies(engine.world);
        bodies.forEach(body => {
            if (body.label === 'ball') Composite.remove(engine.world, body);
        });

        document.getElementById('settlement-modal').style.display = 'none';
        document.getElementById('difficulty-modal').style.display = 'flex';
    }
</script>
</body>
</html>
